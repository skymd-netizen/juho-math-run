<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>주호의 포토 퍼즐 어드벤처</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/puzzle-BUe9tQGh.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/puzzle-DjWo_dVh.css">
</head>
<body>
  <!-- 1. 시작 -->
  <section id="s-start" class="screen active">
    <div class="card">
      <h1>🧩 주호의<br /><span>포토 퍼즐 어드벤처</span></h1>
      <p class="sub">내 사진이 진짜 지그소 퍼즐로 변신!</p>
      <div class="wallet"><span>🪙 <b id="w-coins">0</b></span><span>⭐ <b id="w-stars">0</b></span><span>🧩 <b id="w-count">0</b>개 완성</span></div>
      <button id="btn-start" class="big green">🎮 게임 시작</button>
      <button id="btn-records" class="big blue">📖 나의 퍼즐 기록</button>
      <p class="privacy">🔒 사진은 이 기기 안에서만 처리돼요. 서버로 보내지 않아요.</p>
    </div>
  </section>

  <!-- 2. 사진 선택 -->
  <section id="s-photo" class="screen">
    <div class="card">
      <button class="back" data-go="s-start">◀ 처음으로</button>
      <p class="step">STEP 1 · 사진을 골라요</p>
      <div id="drop" class="drop">
        <canvas id="preview" class="hidden"></canvas>
        <div id="drop-hint"><div class="plus">📷</div><div>눌러서 사진 고르기</div><small>JPG · PNG · WEBP</small></div>
      </div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
      <p id="photo-msg" class="msg"></p>
      <div class="row">
        <button id="btn-change" class="big alt hidden">🔄 다른 사진</button>
        <button id="btn-clear" class="big alt hidden">✖ 선택 취소</button>
      </div>
      <button id="btn-pick" class="big blue">📂 사진 선택하기</button>
      <button id="btn-photo-next" class="big green" disabled>다음 ▶ 난이도 고르기</button>
    </div>
  </section>

  <!-- 3. 난이도 -->
  <section id="s-level" class="screen">
    <div class="card">
      <button class="back" data-go="s-photo">◀ 사진 바꾸기</button>
      <p class="step">STEP 2 · 난이도를 골라요</p>
      <canvas id="level-preview"></canvas>
      <div id="levels" class="levels"></div>
      <button id="btn-make" class="big green">🧩 퍼즐 만들기!</button>
    </div>
  </section>

  <!-- 5. 플레이 -->
  <section id="s-play" class="screen">
    <header class="hud">
      <div class="hud-row">
        <b class="title">🧩 포토 퍼즐</b>
        <span id="hud-level" class="chip">NORMAL</span>
        <span class="chip">⏱ <b id="hud-time">00:00</b></span>
        <span class="chip">🧩 남은 <b id="hud-left">0</b>조각</span>
      </div>
      <div class="bar"><div id="hud-fill"></div><span id="hud-pct">0%</span></div>
    </header>
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="layer"></div>
      <div id="mini" class="hidden"><canvas></canvas></div>
      <div id="big" class="hidden"><canvas></canvas></div>
      <div id="pause" class="hidden">
        <div class="card small"><h2>⏸ 일시정지</h2><button id="btn-resume" class="big green">▶ 계속하기</button></div>
      </div>
    </div>
    <footer class="tools">
      <div id="hint-menu" class="hidden">
        <button data-hint="mini">🖼️ 작은 그림 보기/숨기기</button>
        <button data-hint="ghost">👻 흐린 그림판 켜기/끄기</button>
        <button data-hint="big">🔍 크게 보기 (3초)</button>
      </div>
      <button id="t-hint">💡 힌트</button>
      <button id="t-shuffle">🔀 다시 섞기</button>
      <button id="t-pause">⏸ 일시정지</button>
      <button id="t-quit">🚪 종료</button>
    </footer>
  </section>

  <!-- 6. 결과 -->
  <section id="s-result" class="screen">
    <div class="card">
      <h1 class="done">🎉 퍼즐 완성!</h1>
      <canvas id="result-photo"></canvas>
      <div id="result-stars" class="stars"></div>
      <ul id="result-stats" class="stats"></ul>
      <ul id="result-bonus" class="bonus"></ul>
      <button id="btn-again" class="big green">🔁 다시 하기</button>
      <button id="btn-other" class="big blue">🖼️ 다른 사진으로 도전</button>
      <button id="btn-home" class="big alt">🏠 처음으로</button>
    </div>
  </section>

  <!-- 도감 -->
  <section id="s-records" class="screen">
    <div class="card wide">
      <button class="back" data-go="s-start">◀ 처음으로</button>
      <h2>📖 나의 퍼즐 도감</h2>
      <p id="rec-sum" class="sub"></p>
      <div id="rec-grid" class="grid"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="card small" id="modal-body"></div></div>
  <div id="showcase" class="hidden"><canvas></canvas><div id="show-msg">🎉 짜잔! 완성! 🎉</div></div>
  <div id="toast"></div>

</body>
</html>
