<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>주호 캐릭터 확인</title>
  <style>
    html, body { margin: 0; height: 100%; background: #8fd8ff; font-family: "Malgun Gothic", sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; background: #0006; }
    button { font-size: 15px; padding: 6px 10px; border-radius: 10px; border: 2px solid #fff; background: #3742fa; color: #fff; cursor: pointer; }
    button.on { background: #ff9f1c; }
  </style>
</head>
<body>
  <!-- 개발용: 캐릭터만 크게 띄워 동작과 띠를 확인하는 화면 (게임에는 포함되지 않는다) -->
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <script type="module" src="/src/character-preview.js"></script>
</body>
</html>
